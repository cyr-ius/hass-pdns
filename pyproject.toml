[project]
name = "hass-pdns-component"
version = "0.0.0"
description = "Development environment for the PowerDNS DynHost Home Assistant custom component"
requires-python = ">=3.14.2"
dependencies = []

[tool.setuptools]
# Non-packageable project (see [tool.uv] package = false):
# disable automatic discovery, which makes node_modules irrelevant.
packages = []

[dependency-groups]
lint = ["prek"]
dev = [
  "dnspython>=2.0.0",
  "homeassistant",
  {include-group = "lint"},
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.codespell]
ignore-words-list = "hass"
skip = "./.*,*.csv,*.json,uv.lock"
quiet-level = 2
